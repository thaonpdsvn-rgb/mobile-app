<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VipApp Games</title>
<style>
  :root { --bg:#100e1e; --card:#1a1730; --fg:#f3ecdf; --muted:#b9b0c9; --accent:#ffb38a; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:48px max(16px, env(safe-area-inset-left, 0px)); }
  a.app { display:flex; gap:16px; align-items:center; background:var(--card); border-radius:16px; padding:16px;
          color:var(--fg); text-decoration:none; margin-bottom:12px; }
  a.app img { width:64px; height:64px; border-radius:14px; }
  .sub { color:var(--muted); font-size:.95rem; }
  footer { margin-top:32px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Our apps</h1>
  <a class="app" href="lumigem/"><img src="lumigem/icon.png" alt=""><div><strong>Lumigem</strong><div class="sub">Match 3 gem art puzzle</div></div></a>
  <footer>Contact: thaonp.dsvn@gmail.com</footer>
</div>
</body>
</html>
